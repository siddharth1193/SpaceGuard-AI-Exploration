<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Orbit ring -->
  <ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5" transform="rotate(-25 32 32)"/>
  <!-- Satellite body -->
  <rect x="27" y="27" width="10" height="10" rx="2" fill="url(#g)"/>
  <!-- Solar panels -->
  <rect x="10" y="29" width="15" height="6" rx="1" fill="#3b82f6" opacity="0.8"/>
  <rect x="39" y="29" width="15" height="6" rx="1" fill="#3b82f6" opacity="0.8"/>
  <!-- Panel lines -->
  <line x1="15" y1="29" x2="15" y2="35" stroke="#1e3a5f" stroke-width="0.5"/>
  <line x1="20" y1="29" x2="20" y2="35" stroke="#1e3a5f" stroke-width="0.5"/>
  <line x1="44" y1="29" x2="44" y2="35" stroke="#1e3a5f" stroke-width="0.5"/>
  <line x1="49" y1="29" x2="49" y2="35" stroke="#1e3a5f" stroke-width="0.5"/>
  <!-- Antenna dot -->
  <circle cx="32" cy="24" r="1.5" fill="#06b6d4"/>
  <line x1="32" y1="25.5" x2="32" y2="27" stroke="#06b6d4" stroke-width="1"/>
</svg>
