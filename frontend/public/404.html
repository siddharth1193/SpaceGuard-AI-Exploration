<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SpaceGuard AI — Redirecting</title>
    <script>
      // Single Page Application routing fallback for GitHub Pages
      // Redirects 404s to index.html with the path preserved as a query parameter
      var pathSegmentsToKeep = 1; // '/SpaceGuard-AI-Exploration/' = 1 segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting&hellip;</p>
  </body>
</html>
